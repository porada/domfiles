name: Verify

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: fish-actions/install-fish@v1
      - run: pnpm install
      - run: pnpm format:check

  lint-fish:
    name: lint / fish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: fish-actions/install-fish@v1
      - run: bin/domfiles-dev-lint-fish

  lint-sh:
    name: lint / sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pollenjp/setup-shellcheck@v1
      - run: bin/domfiles-dev-lint-sh

  lint-ts:
    name: lint / ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: fish-actions/install-fish@v1
      - run: pnpm install
      - run: pnpm lint:ts:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install
      - run: pnpm --recursive --include-workspace-root typecheck
