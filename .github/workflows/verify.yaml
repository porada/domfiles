name: Verify

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: home/.local/bin/domfiles-dev-brew-path >> "$GITHUB_PATH"
      - run: brew install fish
      - uses: pnpm/setup@v3.2.0
        with:
          cache: true
          runtime: node@26
      - run: pnpm format:check

  lint-fish:
    name: lint / fish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: home/.local/bin/domfiles-dev-brew-path >> "$GITHUB_PATH"
      - run: brew install fish
      - run: home/.local/bin/domfiles-dev-lint-fish

  lint-json:
    name: lint / json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: home/.local/bin/domfiles-dev-brew-path >> "$GITHUB_PATH"
      - run: brew install jq
      - run: home/.local/bin/domfiles-dev-lint-json

  lint-md:
    name: lint / md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: home/.local/bin/domfiles-dev-brew-path >> "$GITHUB_PATH"
      - uses: pnpm/setup@v3.2.0
        with:
          cache: true
          runtime: node@26
      - run: pnpm lint:md:check

  lint-sh:
    name: lint / sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: home/.local/bin/domfiles-dev-brew-path >> "$GITHUB_PATH"
      - run: brew install shellcheck
      - run: home/.local/bin/domfiles-dev-lint-sh

  lint-ts:
    name: lint / ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: home/.local/bin/domfiles-dev-brew-path >> "$GITHUB_PATH"
      - uses: pnpm/setup@v3.2.0
        with:
          cache: true
          runtime: node@26
      - run: pnpm lint:ts:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: home/.local/bin/domfiles-dev-brew-path >> "$GITHUB_PATH"
      - uses: pnpm/setup@v3.2.0
        with:
          cache: true
          runtime: node@26
      - run: pnpm --recursive --include-workspace-root typecheck
