name: Verify

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  format:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: brew install fish rust taplo
      - uses: pnpm/setup@v2.0.2
        with:
          cache: true
          runtime: node@24
      - run: pnpm format:check

  lint-fish:
    name: lint / fish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: brew install fish
      - run: bin/domfiles-dev-lint-fish

  lint-json:
    name: lint / json
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: brew install jq
      - run: bin/domfiles-dev-lint-json

  lint-rs:
    name: lint / rs
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: brew install rust
      - uses: pnpm/setup@v2.0.2
        with:
          cache: true
          runtime: node@24
      - run: pnpm lint:rs:check

  lint-sh:
    name: lint / sh
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: brew install shellcheck
      - run: bin/domfiles-dev-lint-sh

  lint-toml:
    name: lint / toml
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: brew install taplo
      - run: bin/domfiles-dev-lint-toml

  lint-ts:
    name: lint / ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@v2.0.2
        with:
          cache: true
          runtime: node@24
      - run: pnpm lint:ts:check

  lint-yaml:
    name: lint / yaml
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: brew install yq
      - run: bin/domfiles-dev-lint-yaml

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@v2.0.2
        with:
          cache: true
          runtime: node@24
      - run: pnpm --recursive --include-workspace-root typecheck
