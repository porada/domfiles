name: Verify

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  format:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6.0.8
        with:
          cache: true
      - run: brew install fish
      - run: pnpm install
      - run: pnpm format:check

  lint-fish:
    name: lint / fish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - run: brew install fish
      - run: bin/domfiles-dev-lint-fish

  lint-sh:
    name: lint / sh
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - run: brew install shellcheck
      - run: bin/domfiles-dev-lint-sh

  lint-ts:
    name: lint / ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6.0.8
        with:
          cache: true
      - run: pnpm install
      - run: pnpm lint:ts:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6.0.8
        with:
          cache: true
      - run: pnpm install
      - run: pnpm --recursive --include-workspace-root typecheck
