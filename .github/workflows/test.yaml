name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  sync:
    if: ${{ github.event_name == 'push' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: bin/domfiles-sync
      - run: fish --command 'domfiles sync'

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: brew install fish rust taplo
      - uses: pnpm/setup@v2.0.1
        with:
          cache: true
          runtime: node@24
      - run: pnpm test
