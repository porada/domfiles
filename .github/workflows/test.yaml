name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  sync:
    if: ${{ github.event_name == 'push' }}
    name: sync / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04-arm
          - ubuntu-latest
          - xcode-27
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: home/.local/bin/domfiles-dev-brew-path >> "$GITHUB_PATH"
      - run: home/.local/bin/domfiles-sync
      - run: fish --command 'domfiles sync'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: home/.local/bin/domfiles-dev-brew-path >> "$GITHUB_PATH"
      - run: brew install fish
      - uses: pnpm/setup@v3.1.2
        with:
          cache: true
          runtime: node@24
      - run: pnpm test
      - run: pnpm test:skills
