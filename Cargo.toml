[package]
name = "domfiles"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2024"

[dependencies]
regex = "=1.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
toml = { version = "1.1.4", default-features = false, features = [
  "parse",
  "serde",
  "std",
] }

[[bin]]
name = "domfiles-zed-settings-pattern-match"
path = ".agents/skills/domfiles-zed-settings/scripts/pattern_match.rs"
bench = false
test = false

[[bin]]
name = "domfiles-zed-settings-permission-candidate"
path = ".agents/skills/domfiles-zed-settings/scripts/permission_candidate.rs"
bench = false
test = false

[[bin]]
name = "domfiles-zed-settings-permission-owner-audit"
path = ".agents/skills/domfiles-zed-settings/scripts/permission_owner_audit.rs"
bench = false
test = false

[[bin]]
name = "domfiles-zed-settings-regex-dependency-audit"
path = ".agents/skills/domfiles-zed-settings/scripts/regex_dependency_audit.rs"
bench = false
test = false

[[test]]
name = "domfiles-zed-settings-pattern-match-test"
path = ".agents/skills/domfiles-zed-settings/scripts/pattern_match.test.rs"

[[test]]
name = "domfiles-zed-settings-permission-candidate-test"
path = ".agents/skills/domfiles-zed-settings/scripts/permission_candidate.test.rs"

[[test]]
name = "domfiles-zed-settings-permission-owner-audit-test"
path = ".agents/skills/domfiles-zed-settings/scripts/permission_owner_audit.test.rs"

[[test]]
name = "domfiles-zed-settings-permission-patterns-test"
path = ".agents/skills/domfiles-zed-settings/scripts/helpers/permission_patterns.test.rs"

[[test]]
name = "domfiles-zed-settings-regex-dependency-audit-test"
path = ".agents/skills/domfiles-zed-settings/scripts/regex_dependency_audit.test.rs"
