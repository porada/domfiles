[package]
name = "domfiles"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2024"

[dependencies]
regex = "=1.12.3"
serde_json = "1.0.154"

[[bin]]
name = "subagent-signal"
path = "skills/.domfiles-cli-subagent/scripts/subagent_signal.rs"
bench = false
test = false

[[bin]]
name = "zed-match"
path = ".agents/skills/zed-settings/scripts/zed_match.rs"
bench = false
test = false

[[test]]
name = "subagent-signal-test"
path = "skills/.domfiles-cli-subagent/scripts/subagent_signal.test.rs"

[[test]]
name = "zed-match-test"
path = ".agents/skills/zed-settings/scripts/zed_match.test.rs"
