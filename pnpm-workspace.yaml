packages:
  - packages/*

autoInstallPeers: false

catalog:
  '@standard-config/tsconfig': ^3.1.0
  '@vitest/coverage-v8': ^4.1.4
  prettier: ^3.8.3
  typescript: ^6.0.2
  vitest: ^4.1.4

onlyBuiltDependencies:
  - esbuild

overrides:
  vite-plus>oxfmt: '-'

peerDependencyRules:
  allowAny:
    - typescript
    - vitest

strictPeerDependencies: true

updateConfig:
  ignoreDependencies:
    - '@types/node'
