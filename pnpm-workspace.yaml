packages:
  - packages/*

autoDedupe: true

autoInstallPeers: false

catalog:
  '@standard-config/tsconfig': ^3.2.0
  '@types/node': ^26.6.6
  prettier: ^3.9.10
  tinyexec: ^1.3.1
  typescript: ^7.0.2
  vite-plus: ^1.6.0

color: always

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeExclude:
  - '@standard-config/*'

overrides:
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: latest
  vite-plus>oxlint-tsgolint: latest
  vite: npm:@voidzero-dev/vite-plus-core@latest

permissions:
  esbuild:
    build: false
  koffi:
    build: false

peerDependencyRules:
  allowAny:
    - typescript
    - vite
  ignoreMissing:
    - eslint
    - vitest

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - '@vercel/*'
  - vercel

trustPolicyIgnoreAfter: 43200
