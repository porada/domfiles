packages:
  - packages/*

autoInstallPeers: false

catalog:
  '@standard-config/tsconfig': ^3.2.0
  '@vitest/coverage-v8': ^4.1.10
  prettier: ^3.9.5
  typescript: ^6.0.3
  vite-plus: ^0.2.4

color: always

minimumReleaseAgeExclude:
  - '@standard-config/*'

overrides:
  vite-plus>oxfmt: '-'

peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'

strictPeerDependencies: true

trustPolicy: no-downgrade

updateConfig:
  ignoreDependencies:
    - '@types/node'
