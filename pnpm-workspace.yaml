packages:
  - packages/*

allowBuilds:
  esbuild: false

autoInstallPeers: false

catalog:
  '@standard-config/tsconfig': ^3.2.0
  '@types/node': ^24.13.5
  '@vitest/coverage-v8': 4.1.11
  prettier: ^3.9.8
  tinyexec: ^1.3.1
  typescript: ^6.0.3
  vite-plus: ^0.3.3

color: always

engineStrict: true

minimumReleaseAgeExclude:
  - '@standard-config/*'
  - '@oxlint/binding-linux-arm64-gnu@1.83.0'

overrides:
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: latest
  vite-plus>oxlint-tsgolint: latest
  vite: npm:@voidzero-dev/vite-plus-core@latest

peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 43200

trustPolicyExclude:
  - '@vercel/*'
  - vercel
