packages:
  - packages/*

allowBuilds:
  esbuild: false

autoDedupe: true

autoInstallPeers: false

catalog:
  '@standard-config/tsconfig': ^3.2.0
  '@types/node': ^24.13.6
  '@vitest/coverage-v8': 4.1.11
  prettier: ^3.9.9
  tinyexec: ^1.3.1
  typescript: ^6.0.3
  vite-plus: ^0.3.3

color: always

engineStrict: true

minimumReleaseAgeExclude:
  - '@standard-config/*'

overrides:
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: latest
  vite-plus>oxlint-tsgolint: latest
  vite: npm:@voidzero-dev/vite-plus-core@latest

peerDependencyRules:
  ignoreMissing:
    - eslint
    - vitest

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - '@vercel/*'
  - vercel

trustPolicyIgnoreAfter: 43200
