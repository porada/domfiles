packages:
  - packages/*

allowBuilds:
  agent-browser: true

autoInstallPeers: false

catalog:
  '@standard-config/tsconfig': ^3.2.0
  '@types/node': ^24.13.3
  '@vitest/coverage-v8': 4.1.10
  prettier: ^3.9.6
  tinyexec: ^1.3.0
  typescript: ^6.0.3
  vite-plus: ^0.2.9

color: always

engineStrict: true

minimumReleaseAgeExclude:
  - '@standard-config/*'

overrides:
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: latest
  vite-plus>oxlint-tsgolint: latest

peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'

strictPeerDependencies: true

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - '@types/node'
