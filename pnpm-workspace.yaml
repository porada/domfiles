packages:
  - packages/*

allowBuilds:
  esbuild: false

autoInstallPeers: false

catalog:
  '@standard-config/tsconfig': ^3.2.0
  '@types/node': ^24.13.3
  '@vitest/coverage-v8': 4.1.11
  prettier: ^3.9.6
  tinyexec: ^1.3.1
  typescript: ^6.0.3
  vite-plus: ^0.3.1

color: always

engineStrict: true

minimumReleaseAgeExclude:
  - '@standard-config/*'

overrides:
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: latest
  vite-plus>oxlint-tsgolint: latest
  vite: npm:@voidzero-dev/vite-plus-core@latest

peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 43200

trustPolicyExclude:
  - '@vercel/*'
  - vercel

update:
  ignoreDeps:
    - '@types/node'
