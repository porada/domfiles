packages:
  - packages/*

allowBuilds:
  esbuild: false

autoDedupe: true

autoInstallPeers: false

catalog:
  '@standard-config/tsconfig': ^3.2.0
  '@types/node': ^24.19.2
  '@vitest/coverage-v8': 5.0.3
  prettier: ^3.9.9
  tinyexec: ^1.3.1
  typescript: ^7.0.2
  vite-plus: ^1.1.0

color: always

engineStrict: true

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeExclude:
  - '@standard-config/*'

overrides:
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: latest
  vite-plus>oxlint-tsgolint: latest
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0

peerDependencyRules:
  allowAny:
    - typescript
  ignoreMissing:
    - eslint
    - vitest

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - '@vercel/*'
  - vercel

trustPolicyIgnoreAfter: 43200
