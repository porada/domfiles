packages:
  - packages/*

autoInstallPeers: false

catalog:
  '@standard-config/tsconfig': ^3.2.0
  '@vitest/coverage-v8': ^4.1.9
  prettier: ^3.8.4
  typescript: ^6.0.3
  vite-plus: ^0.2.1

color: always

minimumReleaseAge: 720

overrides:
  vite-plus>oxfmt: '-'

peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'

strictPeerDependencies: true

trustPolicy: no-downgrade

updateConfig:
  ignoreDependencies:
    - '@types/node'
